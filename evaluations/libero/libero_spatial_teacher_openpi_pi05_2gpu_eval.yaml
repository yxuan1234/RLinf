defaults:
  - /env/libero_spatial@env.eval
  - /model/pi0_5@rollout.model
  - override /hydra/job_logging: stdout
  - _self_
hydra:
  run: {dir: .}
  output_subdir: null
  searchpath: ["file://${oc.env:EMBODIED_PATH}/config/"]
cluster:
  num_nodes: 1
  component_placement:
    "env,rollout": all
runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: libero_spatial_teacher_openpi_pi05_2gpu_eval
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
env:
  group_name: EnvGroupSpatialTeacher
  eval:
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 2400
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    video_cfg: {save_video: false, video_base_dir: "${runner.logger.log_path}/video/eval"}
rollout:
  group_name: RolloutGroupSpatialTeacher
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:PI05_SPATIAL_TEACHER_DIR}
    model_type: openpi
    lora_scope: language_model
    num_action_chunks: 10
    num_steps: 5
    openpi:
      num_steps: 5
      noise_level: 0.3
      norm_stats_dir: ${oc.env:PI05_SFT_MODEL_DIR}
